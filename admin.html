<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>অ্যাডমিন – Rahmah Fashion</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{font-family:'Hind Siliguri',system-ui,sans-serif;background:#fbf3e8;color:#2a1520;padding-bottom:30px}
header{background:#5b1a3a;color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.tabs{display:flex;background:#fff;position:sticky;top:48px;z-index:4}.tabs button{flex:1;padding:11px 2px;background:none;border:0;border-bottom:3px solid transparent;font:inherit;font-size:14px}.tabs .on{border-color:#5b1a3a;color:#5b1a3a;font-weight:700}
main{max-width:700px;margin:auto;padding:10px}
.box{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid #dcc9bb;border-radius:10px;margin:3px 0 8px}label{font-size:13px;font-weight:600}
button.b{background:#5b1a3a;color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600}button.r{background:#c0392b}button.l{background:#f3dfe8;color:#5b1a3a}
.row{display:flex;gap:10px;align-items:center}.row>div{flex:1}.row img.t{width:56px;height:70px;object-fit:cover;border-radius:8px;background:#eee}
.ims{display:flex;gap:8px;flex-wrap:wrap}.ims div{position:relative}.ims img{width:80px;height:100px;object-fit:cover;border-radius:8px}.ims i{position:absolute;top:2px;right:2px;background:#c0392b;color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;font-style:normal;line-height:22px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}small{color:#7a6070}
</style></head><body>
<header><b>🛠 Rahmah অ্যাডমিন</b><span><a href="/" style="color:#fff">সাইট</a> <button id="lo" onclick="logout()" style="display:none;margin-left:8px" class="l b">লগআউট</button></span></header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let T=sessionStorage.tk||"",tab="p",D=null,O=[],E=null;
const api=async(p,b)=>{const r=await fetch("/api/"+p,{method:b?"POST":"GET",headers:{"x-token":T},body:b?JSON.stringify(b):undefined});const j=await r.json();if(r.status==401&&T){logout();throw Error("সেশন শেষ")}if(!r.ok)throw Error(j.error);return j};
const logout=()=>{sessionStorage.removeItem("tk");T="";boot()};
const ph="data:image/svg+xml;utf8,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='60' height='75'><rect width='60' height='75' fill='#8a3a6a'/></svg>");
async function boot(){$("#lo").style.display=T?"":"none";if(!T){$("#app").innerHTML=`<div class="box"><h3>লগইন</h3><label>পাসওয়ার্ড</label><input id="pw" type="password"><button class="b" onclick="login()">প্রবেশ করুন</button></div>`;return}
D=await (await fetch("/api/data")).json();try{O=await api("orders")}catch(e){return}draw()}
async function login(){try{T=(await api("login",{password:$("#pw").value})).token;sessionStorage.tk=T;boot()}catch(e){alert(e.message)}}
const saveK=async(k,v)=>{try{await api("save",{key:k,value:v});D[k=="settings"?"settings":k]=v;return true}catch(e){alert(e.message)}};
function draw(){const tb=[["p","পণ্য"],["c","ক্যাটাগরি"],["o","অর্ডার ("+O.filter(o=>o.status=="নতুন").length+")"],["s","সেটিংস"]];
$("#app").innerHTML=`<div class="tabs" style="margin:-10px -10px 10px">${tb.map(t=>`<button class="${tab==t[0]?"on":""}" onclick="tab='${t[0]}';E=null;draw()">${t[1]}</button>`).join("")}</div><div id="v"></div>`;({p:prod,c:cats,o:ords,s:sets})[tab]()}
function prod(){const v=$("#v");if(E)return form(v);
v.innerHTML=`<button class="b" onclick="E={id:'p'+Date.now().toString(36),name:'',cat:D.categories[0]?.id||'',price:0,disc:0,stock:10,sizes:['৫২','৫৪','৫৬'],colors:['কালো'],images:[],desc:''};prod()">➕ নতুন বোরকা</button> ${D.products.some(p=>p.sample)?`<button class="b r" onclick="delSamples()">নমুনা পণ্য মুছুন</button>`:""}<div style="height:10px"></div>`+D.products.map(p=>`<div class="box row"><img class="t" src="${p.images?.[0]||ph}"><div><b>${esc(p.name)}</b>${p.sample?" <small>(নমুনা)</small>":""}<br>৳${p.price} · ছাড় ${p.disc||0}% · স্টক ${p.stock}</div><button class="b l" onclick="E=JSON.parse(JSON.stringify(D.products.find(x=>x.id=='${p.id}')));prod()">এডিট</button><button class="b r" onclick="delP('${p.id}')">🗑</button></div>`).join("")}
async function delSamples(){if(confirm("সব নমুনা পণ্য মুছবেন?")&&await saveK("products",D.products.filter(p=>!p.sample)))draw()}
async function delP(id){if(confirm("এই বোরকা মুছবেন?")&&await saveK("products",D.products.filter(p=>p.id!=id)))draw()}
function form(v){const f=E,fv=(k,l,t="text")=>`<label>${l}</label><input type="${t}" value="${esc(f[k])}" oninput="E.${k}=${t=="number"?"+this.value":"this.value"}">`;
v.innerHTML=`<div class="box"><h3>${D.products.some(p=>p.id==f.id)?"বোরকা এডিট":"নতুন বোরকা"}</h3>${fv("name","বোরকার নাম")}<label>ক্যাটাগরি</label><select onchange="E.cat=this.value">${D.categories.map(c=>`<option value="${c.id}" ${c.id==f.cat?"selected":""}>${esc(c.name)}</option>`).join("")}</select><div class="g2"><div>${fv("price","আসল দাম (৳)","number")}</div><div>${fv("disc","ডিসকাউন্ট (%)","number")}</div></div>${fv("stock","স্টক","number")}<label>সাইজ (কমা দিয়ে)</label><input value="${esc(f.sizes.join(","))}" oninput="E.sizes=this.value.split(',').map(s=>s.trim()).filter(Boolean)"><label>কালার (কমা দিয়ে)</label><input value="${esc(f.colors.join(","))}" oninput="E.colors=this.value.split(',').map(s=>s.trim()).filter(Boolean)"><label>বিবরণ</label><textarea rows="3" oninput="E.desc=this.value">${esc(f.desc)}</textarea>
<label>ছবি (প্রথম ছবিটি কার্ডে দেখাবে)</label><div class="ims">${f.images.map((s,i)=>`<div><img src="${s}" onclick="E.images.unshift(E.images.splice(${i},1)[0]);prod()"><i onclick="E.images.splice(${i},1);prod()">×</i></div>`).join("")}</div><small>ছবিতে ট্যাপ করলে প্রথম ছবি হবে</small><input type="file" accept="image/*" multiple onchange="upl(this)"><p id="up"></p>
<button class="b" onclick="saveP()">💾 সংরক্ষণ</button> <button class="b l" onclick="E=null;prod()">বাতিল</button></div>`}
function shrink(file){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const m=1000,s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.82))};i.onerror=no;i.src=URL.createObjectURL(file)})}
async function upl(inp){const fs=[...inp.files];for(let k=0;k<fs.length;k++){$("#up").textContent=`আপলোড হচ্ছে ${k+1}/${fs.length}...`;try{const d=await shrink(fs[k]);E.images.push((await api("upload",{data:d})).url)}catch(e){alert(e.message)}}prod()}
async function saveP(){if(!E.name.trim())return alert("নাম দিন");if(!(E.price>0))return alert("দাম দিন");E.disc=Math.min(90,Math.max(0,E.disc||0));delete E.sample;const l=[...D.products],i=l.findIndex(p=>p.id==E.id);i<0?l.unshift(E):l[i]=E;if(await saveK("products",l)){E=null;draw()}}
function cats(){$("#v").innerHTML=`<div class="box"><b>নতুন ক্যাটাগরি</b><div class="g2"><input id="cn" placeholder="নাম"><input id="ci" placeholder="আইকন (ইমোজি)" value="🧕"></div><button class="b" onclick="addC()">যোগ করুন</button></div>`+D.categories.map(c=>`<div class="box row"><span style="font-size:26px">${esc(c.icon)}</span><div>${esc(c.name)}</div><button class="b r" onclick="delC('${c.id}')">🗑</button></div>`).join("")}
async function addC(){const n=$("#cn").value.trim();if(!n)return;if(await saveK("categories",[...D.categories,{id:"c"+Date.now().toString(36),name:n,icon:$("#ci").value||"🧕"}]))draw()}
async function delC(id){if(confirm("ক্যাটাগরি মুছবেন?")&&await saveK("categories",D.categories.filter(c=>c.id!=id)))draw()}
function ords(){$("#v").innerHTML=O.length?O.map(o=>`<div class="box"><b>${o.id}</b> · ${new Date(o.at).toLocaleString("bn-BD")}<br>👤 ${esc(o.name)} · <a href="tel:${o.phone}">${o.phone}</a><br>📍 ${esc(o.address)}, ${esc(o.upazila)}, ${esc(o.district)}<br>${o.items.map(i=>`• ${esc(i.name)} (${esc(i.size)}, ${esc(i.color)}) ×${i.qty}`).join("<br>")}<br><b>মোট ৳${o.total}</b> (ডেলিভারি ৳${o.delivery}) · ${{bkash:"বিকাশ",nagad:"নগদ",cod:"COD"}[o.pay]}${o.trx?" · TrxID: <b>"+esc(o.trx)+"</b>":""}<div class="row" style="margin-top:6px"><select onchange="ost('${o.id}',this.value)">${["নতুন","কনফার্মড","শিপড","ডেলিভারড","বাতিল"].map(s=>`<option ${s==o.status?"selected":""}>${s}</option>`).join("")}</select><button class="b r" onclick="odel('${o.id}')">🗑</button></div></div>`).join(""):"<div class='box'>কোনো অর্ডার নেই</div>"}
async function ost(id,s){await api("order-update",{id,status:s});O.find(o=>o.id==id).status=s}
async function odel(id){if(confirm("অর্ডার মুছবেন?")){await api("order-update",{id,del:true});O=O.filter(o=>o.id!=id);ords()}}
function sets(){const s=D.settings;$("#v").innerHTML=`<div class="box"><label>বিকাশ নম্বর</label><input id="sb" value="${esc(s.bkash)}"><label>নগদ নম্বর</label><input id="sn" value="${esc(s.nagad)}"><label>WhatsApp নম্বর (৮৮০ সহ)</label><input id="sw" value="${esc(s.whatsapp)}"><div class="g2"><div><label>ডেলিভারি – ঢাকার ভিতরে ৳</label><input id="si" type="number" value="${s.delivery.in}"></div><div><label>ঢাকার বাইরে ৳</label><input id="so" type="number" value="${s.delivery.out}"></div></div><button class="b" onclick="saveS()">💾 সংরক্ষণ</button></div>`}
async function saveS(){if(await saveK("settings",{bkash:$("#sb").value.trim(),nagad:$("#sn").value.trim(),whatsapp:$("#sw").value.trim().replace(/\D/g,""),delivery:{in:+$("#si").value||0,out:+$("#so").value||0}}))alert("সংরক্ষিত হয়েছে ✓")}
boot();
</script></body></html>
